<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'" />
    <title>أفق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="renderer.css" />
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <div class="brand">
          <img src="icon.png" width="22" height="22" alt="" />
          <span>أفق</span>
        </div>
        <div class="tabs" id="tabs"></div>
        <button class="ghost" id="newTab" title="تبويب جديد">+</button>
        <div class="win">
          <button class="ghost" id="min">–</button>
          <button class="ghost" id="max">□</button>
          <button class="ghost danger" id="close">×</button>
        </div>
      </header>
      <div class="tools">
        <button class="ghost" id="back">‹</button>
        <button class="ghost" id="forward">›</button>
        <button class="ghost" id="reload">↻</button>
        <button class="ghost" id="home">⌂</button>
        <form id="omni">
          <input id="address" dir="ltr" placeholder="ابحث في الويب أو اكتب عنواناً" />
        </form>
        <button class="ghost" id="splitBtn" title="تقسيم الشاشة">⧉</button>
        <button class="ghost" id="adBtn" title="مانع الإعلانات">🛡</button>
        <button class="ghost" id="setBtn" title="الإعدادات">⚙</button>
      </div>
      <main id="stage">
        <section id="start" class="start">
          <img class="mark" src="icon.png" width="72" height="72" alt="" />
          <h1>أفق</h1>
          <p>متصفحك</p>
          <form id="startForm">
            <input id="startQ" placeholder="ابحث في الويب" />
          </form>
          <div class="pins" id="pins"></div>
          <p class="ver" id="ver">أفق 1.2 — يحدّث نفسه تلقائياً</p>
        </section>
        <div id="views" class="views"></div>
      </main>
    </div>
    <div id="settings" class="settings hidden">
      <button class="settings-bg" id="setClose" aria-label="إغلاق"></button>
      <aside class="settings-pane">
        <h2>الإعدادات</h2>
        <h3>الحساب</h3>
        <button class="gold" id="googleBtn">دخول بجوجل</button>
        <h3>محرك البحث</h3>
        <div id="engines" class="engines"></div>
        <h3>مانع الإعلانات</h3>
        <button class="row" id="adToggle"><span>مانع الإعلانات</span><b id="adState">يعمل</b></button>
        <h3>تقسيم الشاشة</h3>
        <button class="row" id="splitToggle"><span>صفحتان جنباً إلى جنب</span><b id="splitState">متوقف</b></button>
        <p class="ver">الإصدار 1.2</p>
      </aside>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
