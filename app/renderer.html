<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'" />
    <title>أفق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="renderer.css" />
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <div class="brand">
          <img src="icon.png" width="22" height="22" alt="" />
          <span>أفق</span>
        </div>
        <div class="tabs" id="tabs"></div>
        <button class="ghost" id="newTab" title="تبويب جديد">+</button>
        <div class="win">
          <button class="ghost" id="min">–</button>
          <button class="ghost" id="max">□</button>
          <button class="ghost danger" id="close">×</button>
        </div>
      </header>
      <div class="tools">
        <button class="ghost" id="back">‹</button>
        <button class="ghost" id="forward">›</button>
        <button class="ghost" id="reload">↻</button>
        <button class="ghost" id="home">⌂</button>
        <form id="omni">
          <input id="address" dir="ltr" placeholder="ابحث في الويب أو اكتب عنواناً" />
        </form>
      </div>
      <main id="stage">
        <section id="start" class="start">
          <img class="mark" src="icon.png" width="72" height="72" alt="" />
          <h1>أفق</h1>
          <p>متصفحك</p>
          <form id="startForm">
            <input id="startQ" placeholder="ابحث في الويب" />
          </form>
          <div class="pins" id="pins"></div>
          <p class="ver" id="ver">أفق يحدّث نفسه تلقائياً</p>
        </section>
        <div id="views"></div>
      </main>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
